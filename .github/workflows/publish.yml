name: publish
on:
  push:
    branches: [main]
    paths-ignore: ['signatures/**']
  workflow_dispatch:
    inputs:
      package:
        description: which package (all publishes every package the registry lacks at its version)
        type: choice
        required: true
        default: all
        options:
          - all
          - rapier-html
          - rapier-markdown-kit
          - rapier-embed
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: an npm that speaks trusted publishing (11.5.1 or newer)
        run: |
          npm install -g npm@11.21.0
          npm --version
          node -e 'const [a, b, c] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("trusted publishing needs npm 11.5.1 or newer"); process.exit(1); }'
      - name: publish what the registry lacks (trusted publishing through OIDC; no token, no secret)
        env:
          CHOSEN: ${{ inputs.package }}
        run: |
          set -u
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTHTOKEN 2>/dev/null || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; if [ -f "$npmrc" ]; then sed -i '/_authToken/d' "$npmrc"; fi
          only="${CHOSEN:-all}"
          failed=0
          for dir in npm/rapier-html npm/rapier-markdown-kit npm/rapier-embed; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$only" != all ] && [ "$only" != "$name" ]; then continue; fi
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "- $name@$version is already on the registry: skipped" | tee -a "$GITHUB_STEP_SUMMARY"; continue
            fi
            log=$(mktemp)
            if (cd "$dir" && for wait in 0 60 120; do sleep "$wait"; npm publish --access public 2>&1 | tee -a "$log"; [ "${PIPESTATUS[0]}" = 0 ] && exit 0; grep -q 'previously staged version' "$log" && exit 0; done; exit 1); then
              # A version npm already holds as staged waits for its release on npmjs.com; that is not a failed run.
              if grep -q 'previously staged version' "$log"; then echo "- $name@$version is staged on npmjs.com, waiting for its release there" | tee -a "$GITHUB_STEP_SUMMARY"
              else echo "- published $name@$version" | tee -a "$GITHUB_STEP_SUMMARY"; fi
            else
              echo "- FAILED $name@$version (is the trusted publisher set on npmjs.com: jackskip22 / rapier-plugins / publish.yml, no environment?)" | tee -a "$GITHUB_STEP_SUMMARY"; failed=1
            fi
          done
          exit $failed
