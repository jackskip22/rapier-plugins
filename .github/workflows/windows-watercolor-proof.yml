name: Windows Watercolor candidate diagnostic
# Run: 20261117T1047Z-barry-paint-watercolor
# Proposed Watercolor proof: exact pinned candidate as a UTF-8 zip.
on:
  push:
    branches: [ci/windows-watercolor-proof-20261117]
    paths: [.github/workflows/windows-watercolor-proof.yml]
permissions:
  contents: read
concurrency:
  group: windows-sealed-watercolor-diagnostic-20261116
  cancel-in-progress: false
jobs:
  watercolor:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /windows-check/unseal.mjs
            /windows-check/sealed-candidate.ps1
            /sealed/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Run the authenticated Watercolor candidate and report fixed diagnostic codes
        shell: pwsh
        env:
          WINDOWS_CANDIDATE_KEY: ${{ secrets.WINDOWS_CANDIDATE_ONCE }}
        run: ./windows-check/sealed-candidate.ps1 -App watercolor
